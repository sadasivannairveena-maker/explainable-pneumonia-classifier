seed: 42

data:
  train_csv: data/manifests/train.csv
  val_csv: data/manifests/val.csv
  image_size: 224
  batch_size: 16
  num_workers: 2

model:
  name: densenet121
  pretrained: true

training:
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 3
  use_amp: true

output:
  directory: artifacts
  checkpoint: artifacts/best_densenet121.pt
  history: reports/training_history.csv
  figure: reports/figures/training_curves.png
